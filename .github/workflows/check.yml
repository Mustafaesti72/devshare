name: Checks
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: devshare_test
          POSTGRES_PASSWORD: devshare_ci_only
          POSTGRES_DB: devshare_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U devshare_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test:unit
      - run: node --experimental-strip-types scripts/check-mvp.mjs
        env:
          DATABASE_URL: postgresql://devshare_test:devshare_ci_only@localhost:5432/devshare_test
      - run: npx tsc --noEmit
      - run: npm run build
